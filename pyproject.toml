[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "live-audio-intelligence-mcp"
version = "0.1.2"
description = "Institutional-grade MCP server for live financial webcast transcription and vocal stress analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LiveAudioIntelligence Contributors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "whisper",
    "transcription",
    "prosody",
    "vocal-stress",
    "earnings-calls",
    "finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "faster-whisper>=1.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "yt-dlp>=2024.0.0",
    "pydantic>=2.0.0",
    "soundfile>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/ykshah1309/live-audio-intelligence-mcp"
Repository = "https://github.com/ykshah1309/live-audio-intelligence-mcp"
Issues = "https://github.com/ykshah1309/live-audio-intelligence-mcp/issues"

[project.scripts]
live-audio-intelligence-mcp = "live_audio_intelligence_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/live_audio_intelligence_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/requirements.txt",
    "/server.json",
]
